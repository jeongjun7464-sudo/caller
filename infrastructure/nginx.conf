events {}
http {limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;upstream api{server backend:8000;}upstream web{server reveal-web:80;}server{listen 80;location /api/{limit_req zone=api burst=30 nodelay;proxy_pass http://api;proxy_set_header X-Forwarded-Proto $scheme;proxy_set_header X-Request-ID $request_id;}location /docs{proxy_pass http://api;}location /openapi.json{proxy_pass http://api;}location /{proxy_pass http://web;}}}

